# Builds the Windows app on GitHub's servers.
#   push a tag like v1.2.3  -> builds + publishes a GitHub Release with BrainrotGoonMachine-Setup.exe
#                              (every installed copy sees it and offers "UPDATE ME")
#   "Run workflow" button   -> test build, Setup uploaded as an artifact (no release)
name: Build Windows app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -U pip wheel
          python -m pip install -r requirements.txt pyinstaller pywebview

      - name: Pick version from tag
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0" }
          "APP_VER=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build exe
        run: python build_exe.py --version "$env:APP_VER" --repo "${{ github.repository }}"

      - name: Self-test the exe
        shell: pwsh
        run: |
          $p = Start-Process dist\BrainrotGoonMachine\BrainrotGoonMachine.exe -ArgumentList "--selftest","--quiet" -PassThru -Wait
          Get-Content "$env:LOCALAPPDATA\BrainrotGoonMachine\selftest.txt"
          if ($p.ExitCode -ne 0) { throw "selftest failed" }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:APP_VER" "/DAppURL=https://github.com/${{ github.repository }}" installer.iss

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-Setup.exe
          generate_release_notes: true

      - name: Save Setup (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: BrainrotGoonMachine-Setup
          path: dist/*-Setup.exe
